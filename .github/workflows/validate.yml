name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Telegram webhook syntax
        run: npm test
      - name: Verify website entry points
        run: test -f index.html && test -f index-en.html && test -f dashboard.html
